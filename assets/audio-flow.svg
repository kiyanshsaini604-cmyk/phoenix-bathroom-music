<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <rect width="1280" height="640" fill="#0b1720"/>
  <rect x="40" y="40" width="1200" height="560" rx="18" fill="#112130" stroke="#2a4a66" stroke-width="2"/>

  <text x="60" y="78" font-family="system-ui,sans-serif" font-size="26" font-weight="700" fill="#ffffff">Phoenix — audio &amp; voice signal path</text>
  <text x="60" y="108" font-family="system-ui,sans-serif" font-size="16" fill="#9fd0e0">Microphone → recognition → server request → speaker playback</text>

  <!-- Stage boxes -->
  <g font-family="system-ui,sans-serif" fill="#ffffff">
    <rect x="100" y="200" width="230" height="130" rx="12" fill="#1c3b4f" stroke="#3d7a96" stroke-width="2"/>
    <text x="130" y="240" font-weight="700" font-size="18">Microphone</text>
    <text x="130" y="270" fill="#bcd9e6">protected acoustic port</text>
    <text x="130" y="292" fill="#bcd9e6">+ membrane</text>

    <rect x="440" y="200" width="230" height="130" rx="12" fill="#1c3b4f" stroke="#3d7a96" stroke-width="2"/>
    <text x="470" y="240" font-weight="700" font-size="18">Voice recognition</text>
    <text x="470" y="270" fill="#bcd9e6">Vosk offline engine</text>
    <text x="470" y="292" fill="#bcd9e6">wake word + command</text>

    <rect x="780" y="200" width="230" height="130" rx="12" fill="#1c3b4f" stroke="#3d7a96" stroke-width="2"/>
    <text x="810" y="240" font-weight="700" font-size="18">Music server</text>
    <text x="810" y="270" fill="#bcd9e6">Subsonic-compatible</text>
    <text x="810" y="292" fill="#bcd9e6">library + stream</text>

    <rect x="440" y="400" width="230" height="130" rx="12" fill="#1c3b4f" stroke="#3d7a96" stroke-width="2"/>
    <text x="470" y="440" font-weight="700" font-size="18">Speaker output</text>
    <text x="470" y="470" fill="#bcd9e6">built-in speaker</text>
    <text x="470" y="492" fill="#bcd9e6">amp + grille</text>
  </g>

  <!-- Signal flow arrows -->
  <g stroke="#4fc3a8" stroke-width="3" fill="none" marker-end="url(#arrowhead)">
    <path d="M 330 265 L 440 265"/>
    <path d="M 670 265 L 780 265"/>
    <path d="M 895 265 L 895 395"/>
    <path d="M 895 395 L 555 395"/>
    <path d="M 555 395 L 555 465"/>
  </g>

  <!-- Return path: server stream to speaker -->
  <g stroke="#ffb74d" stroke-width="3" fill="none" stroke-dasharray="6 6" marker-end="url(#arrowhead)">
    <path d="M 670 335 L 780 335"/>
    <path d="M 780 335 L 780 400"/>
    <path d="M 780 400 L 555 400"/>
  </g>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon fill="#4fc3a8" points="0 0, 10 3.5, 0 7"/>
    </marker>
  </defs>

  <!-- Labels -->
  <g font-family="system-ui,sans-serif" fill="#8fb6c6" font-size="14">
    <text x="130" y="360">capture voice</text>
    <text x="490" y="360">recognize phrase</text>
    <text x="620" y="330" fill="#ffb74d">request track</text>
    <text x="560" y="515" fill="#ffb74d">play stream</text>
    <text x="840" y="355">stream audio</text>
  </g>

  <text x="60" y="605" font-family="system-ui,sans-serif" fill="#8fb6c6" font-size="14">All processing is local where possible; only the track stream travels to the music server.</text>
</svg>
