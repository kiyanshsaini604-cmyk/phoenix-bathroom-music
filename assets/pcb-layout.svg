<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <rect width="1280" height="640" fill="#0b1720"/>
  <rect x="40" y="40" width="1200" height="560" rx="18" fill="#112130" stroke="#2a4a66" stroke-width="2"/>

  <text x="60" y="78" font-family="system-ui,sans-serif" font-size="26" font-weight="700" fill="#ffffff">Phoenix — PCB layout</phoenix>
  <text x="60" y="108" font-family="system-ui,sans-serif" font-size="16" fill="#9fd0e0">Two-layer control board: compute interface, display, audio amp, mic preamp, power inlet.</text>

  <!-- Board outline -->
  <rect x="100" y="180" width="560" height="380" rx="20" fill="#1c3b4f" stroke="#3d7a96" stroke-width="3"/>

  <!-- Mounting holes -->
  <g fill="#2fd6c8">
    <circle cx="130" cy="210" r="8"/>
    <circle cx="610" cy="210" r="8"/>
    <circle cx="130" cy="520" r="8"/>
    <circle cx="610" cy="520" r="8"/>
  </g>

  <!-- Compute board connector (left edge) -->
  <rect x="100" y="260" width="14" height="120" rx="2" fill="#2a4a66" stroke="#4f7d93" stroke-width="1"/>
  <g fill="#4f7d93" font-size="11">
    <text x="70" y="265" text-anchor="end">GPIO</text>
    <text x="70" y="280" text-anchor="end">I2S</text>
    <text x="70" y="295" text-anchor="end">I2C</text>
    <text x="70" y="310" text-anchor="end">5V</text>
    <text x="70" y="325" text-anchor="end">GND</text>
  </g>

  <!-- Display connector -->
  <rect x="340" y="180" width="14" height="100" rx="2" fill="#2a4a66" stroke="#4f7d93" stroke-width="1"/>
  <g fill="#4f7d93" font-size="11">
    <text x="360" y="200">SPI</text>
    <text x="360" y="215">CS</text>
    <text x="360" y="230">DC</text>
    <text x="360" y="245">RST</text>
    <text x="360" y="260">BL</text>
  </g>

  <!-- Audio amp section -->
  <rect x="260" y="340" width="200" height="110" rx="10" fill="#16404c" stroke="#3d7a96" stroke-width="2"/>
  <text x="280" y="370" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Audio amp</text>
  <text x="280" y="390" fill="#bcd9e6">speaker driver</text>
  <text x="280" y="410" fill="#bcd9e6">+ codec stage</text>

  <!-- Mic preamp section -->
  <rect x="260" y="210" width="200" height="110" rx="10" fill="#16404c" stroke="#3d7a96" stroke-width="2"/>
  <text x="280" y="240" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Mic preamp</text>
  <text x="280" y="260" fill="#bcd9e6">acoustic membrane</text>
  <text x="280" y="280" fill="#bcd9e6">protected port</text>

  <!-- Power inlet (right edge) -->
  <rect x="630" y="330" width="30" height="120" rx="4" fill="#2a4a66" stroke="#4f7d93" stroke-width="1"/>
  <g fill="#4f7d93" font-size="11" text-anchor="middle">
    <text x="645" y="350">VIN</text>
    <text x="645" y="365">GND</text>
  </g>

  <!-- Speaker output -->
  <rect x="480" y="340" width="80" height="60" rx="6" fill="#16404c" stroke="#3d7a96" stroke-width="2"/>
  <text x="520" y="370" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">SPK</text>
  <text x="520" y="390" fill="#bcd9e6" text-anchor="middle">output</text>

  <!-- Traces -->
  <g stroke="#4fc3a8" stroke-width="2" fill="none">
    <!-- Compute to amp -->
    <path d="M 114 310 L 260 310 L 260 395"/>
    <!-- Compute to mic preamp -->
    <path d="M 114 260 L 260 260 L 260 295"/>
    <!-- Compute to display -->
    <path d="M 340 210 L 354 210"/>
    <!-- Amp to speaker -->
    <path d="M 460 395 L 480 395"/>
    <!-- Power to amp -->
    <path d="M 630 390 L 460 390"/>
    <!-- Power to mic preamp -->
    <path d="M 630 340 L 260 340"/>
  </g>

  <!-- Legend -->
  <g font-family="system-ui,sans-serif" fill="#8fb6c6" font-size="14">
    <text x="700" y="200">Board: 2-layer FR-4, 1.6 mm</text>
    <text x="700" y="220">Pads: mounting holes (4), connectors, component footprints</text>
    <text x="700" y="240">Traces: power, audio, display, compute interface</text>
    <text x="700" y="260">Source: KiCad `phoenix.kicad_pcb` in `hardware/phoenix-kicad/`</text>
  </g>

</svg>
